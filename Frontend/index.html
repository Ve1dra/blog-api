<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriTrade - Sign up</title>
    <link rel="stylesheet" href="../../static/styles/signup.css">
</head>

<body>
    <div class="parent-container">
        <div class="img-container">
            <img src="../../src/images/veldra_no_bg.png" alt="Company logo">
        </div>
        <div class="form-container">
            <div class="signup">
                <div class="toggle left">
                    <p>Create account</pp>
                </div>
            </div>

            <div class="signup-form">
                <p class="headings">Get started on Agri<span>Trade</span></p>
                <p class="headings">Create your account gain the confidence to proceed to the next stage!</p>
                
                <form id="registerForm">
                    <!-- action="../protected/index.html" -->
                    <label for="username">Username</label>
                    <input type="text" id="username">
                    <span id="usernameError" class="error"></span>
                    
                    <label for="email">email</label>
                    <input type="email" id="email">
                    <span id="emailError" class="error"></span>
                    
                    <label>Date of Birth</label>
                    <input type="date" id="dob" />
                    <span id="dobError" class="error"></span>
                    
                    <div class="number">
                        <label for="number">Phone number</label>
                        <input type="text" inputmode="numeric" id="number">
                        <span id="numberError" class="error"></span>
                        <p class="headings">You may receive notifications from us.</p>
                    </div>
                    
                    <label for="password">Password</label>
                    <input type="password" id="password">
                    <span id="passwordError" class="error"></span>
                    

                    <label for="c_password">Confirm password</label>
                    <input type="password" id="c_password">
                    <span id="c_passwordError" class="error"></span>

                    <p class="headings">By tapping Submit, you agree to create an account and to
                        Agri<span>Trade</span>Terms, Provacy Policy and Cookies Policy</p>

                    <button id="button">Submit</button>
                </form>
                <a href="./templates/accounts/login.html">I already have an account</a>
            </div>
        </div>
    </div>
</body>
<script src="../../static/script/signup.js"></script>
</html>
